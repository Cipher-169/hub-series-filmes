<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090c16">
<meta name="description" content="Meu espaço pessoal para filmes e séries — Clpher">
<title>Hub de Filmes &amp; Séries — Clpher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,800;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HERO ============ -->
<header class="hero" id="hero">
  <div class="top">
    <div class="brand">Hub de <i>filmes</i> &amp; <i>séries</i><span class="project-version" id="project-version">v—</span></div>
    <div class="who">
      <span class="profile-chip" aria-label="Perfil Trakt fixo">Trakt: <strong>Clpher</strong></span>
      <button id="btn-sync" type="button">Sincronizar Trakt</button>
      <button id="btn-trakt-auth" type="button">Conectar Trakt</button>
      <button id="btn-login" type="button">Entrar com Google</button>
    </div>
  </div>
  <div class="hero-in" id="heroin">
    <h1>Carregando…</h1>
  </div>
</header>

<!-- ============ SHELL ============ -->
<div class="wrap">
  <p class="sync-status" id="sync-status" role="status">Catálogo público via Trakt; cache local por até 24 horas.</p>
  <p class="meta" id="me"></p>

  <!-- Abas -->
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-tab="agora">Agora</button>
    <button role="tab" aria-selected="false" data-tab="filmes">Filmes</button>
    <button role="tab" aria-selected="false" data-tab="series">Séries</button>
    <button role="tab" aria-selected="false" data-tab="stats" id="stats-tab" class="hidden">Estatísticas</button>
  </div>

  <!-- Barra de filtros (visível em Filmes/Séries) -->
  <div class="bar hidden" id="filters">
    <input id="search-query" type="search" placeholder="Filtrar por nome…" aria-label="Filtrar por nome">
    <select id="filter-status" aria-label="Status">
      <option value="">Todos os status</option>
      <option value="watching">Assistindo</option>
      <option value="completed">Concluídos</option>
      <option value="plantowatch">Quero assistir</option>
      <option value="dropped">Abandonados</option>
    </select>
    <select id="filter-year" aria-label="Ano"></select>
    <select id="filter-limit" aria-label="Quantidade">
      <option value="25">Top 25</option>
      <option value="50">Top 50</option>
      <option value="9999">Tudo</option>
    </select>
  </div>

  <!-- Área de conteúdo -->
  <div id="view"></div>
</div>

<!-- ============ MODAL DE DETALHES ============ -->
<dialog id="dlg"></dialog>

<!-- ============ SCRIPTS ============ -->
<script src="js/trakt.js"></script>
<script src="js/hub.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
