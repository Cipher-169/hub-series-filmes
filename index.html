<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171613">
<meta name="description" content="Uma biblioteca pessoal de filmes e séries.">
<title>Arquivo — Filmes &amp; Séries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<!-- ============ HERO ============ -->
<header class="hero" id="hero">
  <div class="top">
    <div class="brand">
      Hub de <i>filmes</i> &amp; <i>séries</i><span class="project-version" id="project-version">v—</span>
      <a class="trakt-profile-link" href="https://trakt.tv/users/Cypher169" target="_blank" rel="noopener noreferrer">Meu Trakt ↗</a>
    </div>
    <div class="who">
      <span class="profile-chip" aria-label="Perfil Trakt fixo">Trakt: <strong>Cypher169</strong></span>
      <button id="btn-sync" type="button">Sincronizar Trakt</button>
      <button id="btn-login" type="button">Entrar com Google</button>
    </div>
  </div>
  <div class="hero-in" id="heroin">
    <h1>Carregando…</h1>
  </div>
</header>

<!-- ============ SHELL ============ -->
<div class="wrap">
  <p class="sync-status" id="sync-status" role="status">Catálogo público via Trakt; cache local por até 6 horas.</p>

  <!-- Painel de Conexão com Trakt (gerenciado após login no Google) -->
  <section class="trakt-connect" id="trakt-connect-section" aria-label="Conexão da conta Trakt">
    <div class="trakt-connect-info">
      <strong>Conexão com Trakt</strong>
      <span class="trakt-connect-status" id="trakt-connection-status" role="status">Entre com a conta Google proprietária para verificar ou conectar o Trakt.</span>
    </div>
    <div class="trakt-connect-actions">
      <button type="button" class="primary" id="btn-trakt-connect" disabled>Conectar Trakt</button>
      <button type="button" id="btn-trakt-disconnect" class="hidden">Desconectar</button>
    </div>
  </section>

  <p class="meta" id="me"></p>

  <!-- Abas -->
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-tab="agora">Agora</button>
    <button role="tab" aria-selected="false" data-tab="filmes">Filmes</button>
    <button role="tab" aria-selected="false" data-tab="series">Séries</button>
    <button role="tab" aria-selected="false" data-tab="stats" id="stats-tab" class="hidden">Estatísticas</button>
  </div>

  <!-- Barra de filtros (visível em Filmes/Séries) -->
  <div class="bar hidden" id="filters">
    <input id="search-query" type="search" placeholder="Filtrar por nome…" aria-label="Filtrar por nome">
    <select id="filter-status" aria-label="Status">
      <option value="">Todos os status</option>
      <option value="watching">Assistindo</option>
      <option value="completed">Concluídos</option>
      <option value="plantowatch">Quero assistir</option>
      <option value="dropped">Abandonados</option>
    </select>
    <select id="filter-year" aria-label="Ano"></select>
    <select id="filter-limit" aria-label="Quantidade">
      <option value="25">Top 25</option>
      <option value="50">Top 50</option>
      <option value="9999">Tudo</option>
    </select>
  </div>

  <!-- Área de conteúdo -->
  <div id="view"></div>
</div>

<!-- ============ MODAL DE DETALHES ============ -->
<dialog id="dlg"></dialog>

<!-- ============ CRÉDITOS ============ -->
<footer class="tmdb-credits" aria-label="Créditos e fontes">
  <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer" aria-label="The Movie Database">
    <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg" alt="TMDB" loading="lazy">
  </a>
  <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</footer>

<!-- ============ SCRIPTS ============ -->
<script src="js/trakt.js"></script>
<script src="js/hub.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
